<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <title>DANA v2 — контроль водителя + машинка ESP32</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #video { width: 100%; height: 40vh; object-fit: cover; transform: scaleX(-1); background: #000; }
    #status { min-height: 18vh; display: flex; align-items: center; justify-content: center; text-align: center;
              font-size: 2rem; font-weight: 700; padding: 12px; }
    #status.ok { color: #7CFC00; }
    #status.calib { color: #FFD700; }
    #status.danger { color: #ff3b30; animation: blink 0.5s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    #info { font-size: 0.9rem; text-align: center; color: #bbb; padding: 4px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 6px 12px; }
    button { flex: 1; font-size: 1.1rem; padding: 14px; border: 0; border-radius: 12px; color: #fff; background: #333; }
    button:disabled { opacity: 0.4; }
    #start { background: #1e7d32; font-size: 1.2rem; padding: 16px; }
    #stop { background: #555; font-size: 1.2rem; padding: 16px; }
    #bleConnect { background: #1565c0; }
    #ble { border: 1px solid #333; border-radius: 12px; margin: 6px 12px; padding: 4px 0; }
    #bleStatus { flex-basis: 100%; display: flex; align-items: center; gap: 8px; font-size: 1rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #666; flex: none; }
    .dot.on { background: #7CFC00; }
    .dot.connecting { background: #FFD700; }
    .dot.lost { background: #ff3b30; }
    #bleHint { flex-basis: 100%; font-size: 0.85rem; color: #ffb74d; }
    #driver, select { width: 100%; box-sizing: border-box; font-size: 1.05rem; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; }
    label { font-size: 0.95rem; color: #ccc; }
    .settings label { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 4px; }
    .check { flex-direction: row !important; align-items: center; gap: 8px !important; }
    .check input { width: 22px; height: 22px; }
    #logRow { font-size: 0.9rem; color: #bbb; padding-bottom: 16px; }
    #logRow button { font-size: 0.95rem; padding: 10px; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status" class="calib">Нажмите «Старт»</div>
  <div id="info"></div>

  <div id="ble">
    <div class="row">
      <div id="bleStatus"><span id="bleDot" class="dot"></span><span id="bleText">Машинка: не подключена</span></div>
      <div id="bleHint" hidden></div>
      <button id="bleConnect">Подключить машинку</button>
      <button id="bleTest" disabled>Тест: ехать 3 с</button>
    </div>
  </div>

  <div class="row">
    <input id="driver" type="text" placeholder="Имя водителя" maxlength="60">
  </div>
  <div class="row settings">
    <label>Тревога, если глаза закрыты
      <select id="closedSeconds">
        <option value="1.5">1,5 с</option>
        <option value="2" selected>2 с</option>
        <option value="2.5">2,5 с</option>
        <option value="3">3 с</option>
      </select>
    </label>
    <label class="check"><input id="phoneSound" type="checkbox" checked> Звук на телефоне</label>
  </div>
  <div class="row">
    <button id="start">Старт</button>
    <button id="stop" disabled>Стоп</button>
  </div>
  <div id="logRow" class="row">
    <span id="logCount">Записей о засыпании: 0</span>
    <button id="export">Скачать журнал (CSV)</button>
    <button id="clear">Очистить</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
