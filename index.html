<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <title>DANA - Жүргізуші бақылауы</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #video { width: 100%; height: 45vh; object-fit: cover; transform: scaleX(-1); background: #000; }
    #status { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
              font-size: 2rem; font-weight: 700; padding: 12px; }
    #status.ok { color: #7CFC00; }
    #status.calib { color: #FFD700; }
    #status.danger { color: #ff3b30; animation: blink 0.5s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    #info { font-size: 0.9rem; text-align: center; color: #bbb; padding: 4px; }
    #controls { display: flex; gap: 10px; padding: 12px; }
    button { flex: 1; font-size: 1.2rem; padding: 16px; border: 0; border-radius: 12px; color: #fff; }
    #start { background: #1e7d32; }
    #stop { background: #555; }
    button:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div id="status" class="calib">Нажмите «Старт»</div>
  <div id="info"></div>
  <div id="controls">
    <button id="start">Старт</button>
    <button id="stop" disabled>Стоп</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
